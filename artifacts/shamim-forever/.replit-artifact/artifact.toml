kind = "web"
previewPath = "/"
title = "Shamim Forever"
version = "1.0.0"
id = "artifacts/shamim-forever"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20898

[services.development]
run = "pnpm --filter @workspace/shamim-forever run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shamim-forever", "run", "build" ]
publicDir = "artifacts/shamim-forever/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20898"
BASE_PATH = "/"
